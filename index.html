<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fefefe" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Minutes — an offline-first meeting notes app.">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Minutes</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #fefefe;
      --fg: #1c1c1c;
      --muted: #6b6b6b;   /* secondary text — meets 4.5:1 on --bg */
      --subtle: #8a8a8a;  /* placeholders / hints / quiet labels */
      --faint: #dcdcdc;   /* hairline borders only */
      --surface-hover: var(--surface-hover);
      --surface-active: var(--surface-active);
      --chip: var(--chip);
      --over-bg: var(--over-bg);  /* overdue / alert */
      --over-fg: var(--over-fg);
      --soon-bg: var(--soon-bg);  /* due soon / warning */
      --soon-fg: var(--soon-fg);
      --link: #3a6ea5;    /* tag links / cross-references */
      --mono: 'JetBrains Mono', monospace;
      --serif: 'Lora', serif;
      --r: 3px;
      --font-sz: 13px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --fg: #e8e8e8;
        --muted: #9a9a9a;
        --subtle: #777;
        --faint: #333;
        --surface-hover: #242424;
        --surface-active: #2c2c2c;
        --chip: #2a2a2a;
        --over-bg: #3a2222;
        --over-fg: #e88;
        --soon-bg: #3a3320;
        --soon-fg: #e0b056;
        --link: #6fa3d6;
      }
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: var(--font-sz);
    }

    .shell {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    /* ── RAIL ── */
    .rail {
      width: 210px;
      min-width: 210px;
      border-right: 1px solid var(--faint);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .rail-top {
      padding: 22px 18px 14px;
      border-bottom: 1px solid var(--faint);
    }

    .wordmark {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.3px;
      display: block;
      margin-bottom: 12px;
    }

    .btn-new {
      width: 100%;
      padding: 7px 0;
      background: var(--fg);
      color: var(--bg);
      border: none;
      border-radius: var(--r);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: opacity 0.14s;
    }

    .btn-new:hover {
      opacity: 0.7;
    }

    .search-box {
      padding: 10px 18px 6px;
      border-bottom: 1px solid var(--faint);
    }

    .search-box input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 4px 0;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg);
      outline: none;
      border-bottom: 1px solid var(--faint);
      transition: border-color 0.12s;
    }

    .search-box input::placeholder {
      color: var(--subtle);
    }

    .search-box input:focus {
      border-color: var(--muted);
    }

    /* rail tabs */
    .rail-tabs {
      display: flex;
      border-bottom: 1px solid var(--faint);
      flex-shrink: 0;
    }

    .rail-tab {
      flex: 1;
      padding: 7px 0;
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.3px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.1s, border-color 0.1s;
    }

    .rail-tab:hover {
      color: var(--fg);
    }

    .rail-tab.active {
      color: var(--fg);
      border-bottom-color: var(--fg);
      margin-bottom: -1px;
    }

    .tab-badge {
      display: inline-block;
      margin-left: 5px;
      min-width: 15px;
      padding: 0 4px;
      border-radius: 8px;
      font-size: 9px;
      line-height: 15px;
      text-align: center;
      vertical-align: middle;
      background: var(--chip);
      color: var(--muted);
    }

    .tab-badge-overdue {
      background: var(--over-bg);
      color: var(--over-fg);
    }

    .note-list {
      flex: 1;
      overflow-y: auto;
      display: none;
    }

    .note-list.visible {
      display: block;
    }

    .note-list::-webkit-scrollbar {
      width: 3px;
    }

    .note-list::-webkit-scrollbar-thumb {
      background: var(--faint);
    }

    .ni {
      padding: 10px 18px;
      cursor: pointer;
      border-bottom: 1px solid var(--faint);
      transition: background 0.1s;
      position: relative;
    }

    .ni:hover {
      background: var(--surface-hover);
    }

    .ni.active {
      background: var(--surface-active);
    }

    .ni.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 22%;
      bottom: 22%;
      width: 2px;
      background: var(--fg);
      border-radius: 2px;
    }

    .ni-title {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .ni-sub {
      font-size: 10px;
      color: var(--muted);
    }

    .list-empty {
      padding: 20px 18px;
      font-size: 11px;
      color: var(--subtle);
    }

    /* consolidated panels */
    .consolidated {
      flex: 1;
      overflow-y: auto;
      display: none;
    }

    .consolidated.visible {
      display: block;
    }

    .consolidated::-webkit-scrollbar {
      width: 3px;
    }

    .consolidated::-webkit-scrollbar-thumb {
      background: var(--faint);
    }

    .con-filter {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 1;
      padding: 8px 12px;
      border-bottom: 1px solid var(--faint);
    }

    .con-filter input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg);
      outline: none;
      padding: 2px 0;
      border-bottom: 1px solid var(--faint);
      transition: border-color 0.12s;
    }

    .con-filter input::placeholder {
      color: var(--subtle);
    }

    .con-filter input:focus {
      border-color: var(--muted);
    }

    .con-item {
      padding: 8px 12px;
      border-bottom: 1px solid var(--faint);
      cursor: pointer;
      transition: background 0.1s;
    }

    .con-item:hover {
      background: var(--surface-hover);
    }

    .con-item-text {
      font-size: 11px;
      color: var(--fg);
      line-height: 1.5;
      margin-bottom: 3px;
    }

    .con-item-meta {
      font-size: 10px;
      color: var(--muted);
    }

    .con-item-who {
      font-style: italic;
    }

    .rail-foot {
      padding: 10px 12px;
      border-top: 1px solid var(--faint);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .rb {
      flex: 1;
      padding: 6px 0;
      border: 1px solid var(--faint);
      background: transparent;
      border-radius: var(--r);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }

    .rb:hover {
      border-color: var(--fg);
      color: var(--fg);
    }

    .file-import-hidden {
      display: none;
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--subtle);
    }

    .editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* meta bar */
    .meta-bar {
      display: flex;
      align-items: center;
      padding: 0 44px;
      height: 42px;
      border-bottom: 1px solid var(--faint);
      flex-shrink: 0;
    }

    .mf {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-right: 16px;
      margin-right: 16px;
      border-right: 1px solid var(--faint);
    }

    .mf:last-of-type {
      border-right: none;
    }

    .ml {
      font-size: 9px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--subtle);
    }

    .mi {
      border: none;
      background: transparent;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg);
      outline: none;
      caret-color: var(--fg);
    }

    .mi::placeholder {
      color: var(--subtle);
    }

    input[type=date].mi,
    input[type=time].mi {
      cursor: pointer;
    }

    .meta-gap {
      flex: 1;
    }

    .del-btn {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--subtle);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: var(--r);
      transition: color 0.12s;
    }

    .del-btn:hover {
      color: var(--over-fg);
    }

    /* title */
    .title-wrap {
      padding: 28px 44px 0;
      flex-shrink: 0;
    }

    .title-inp {
      width: 100%;
      border: none;
      background: transparent;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 500;
      color: var(--fg);
      letter-spacing: -0.2px;
      outline: none;
      caret-color: var(--fg);
      line-height: 1.3;
    }

    .title-inp::placeholder {
      color: var(--subtle);
      font-style: italic;
    }

    /* scroller */
    .scroller {
      flex: 1;
      overflow-y: auto;
      padding: 18px 44px 48px;
    }

    .scroller::-webkit-scrollbar {
      width: 4px;
    }

    .scroller::-webkit-scrollbar-thumb {
      background: var(--faint);
      border-radius: 2px;
    }

    .notes-lbl {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--subtle);
      margin-bottom: 10px;
      margin-top: 22px;
    }

    /* ── TEXTAREA EDITOR ── */
    .notes-editor {
      min-height: 220px;
    }

    .notes-editable {
      outline: none;
      min-height: 220px;
      font-family: var(--mono);
      font-size: var(--font-sz);
      line-height: 1.7;
      color: var(--fg);
      padding: 8px 0;
    }

    .notes-editable:empty::before {
      content: attr(data-placeholder);
      color: var(--subtle);
      font-style: italic;
    }

    .notes-editable ol {
      list-style: none;
      counter-reset: item;
      padding: 0;
      margin: 0;
    }

    .notes-editable li {
      counter-increment: item;
      margin-bottom: 8px;
      padding-left: 32px;
      position: relative;
    }

    .notes-editable li::before {
      content: counter(item) ".";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--muted);
      font-weight: 400;
      min-width: 24px;
      text-align: right;
    }

    .inf-row {
      position: relative;
    }

    .inf-row-done {
      opacity: 0.5;
    }

    .inf-row-done .inf-txt {
      text-decoration: line-through;
    }

    .inf-close-btn {
      flex-shrink: 0;
      align-self: center;
      background: none;
      border: 1px solid var(--faint);
      border-radius: var(--r);
      color: var(--muted);
      font-size: 14px;
      padding: 2px 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, border-color 0.15s;
    }

    .inf-row:hover .inf-close-btn {
      opacity: 1;
    }

    .inf-close-btn:hover {
      border-color: var(--fg);
      color: var(--fg);
    }

    .inf-done-note {
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
      display: block;
      margin-top: 2px;
    }

    .con-item {
      position: relative;
    }

    .con-item-done {
      opacity: 0.6;
    }

    .con-item-done .con-item-text {
      text-decoration: line-through;
    }

    .con-close-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      background: var(--bg);
      border: 1px solid var(--faint);
      border-radius: var(--r);
      color: var(--muted);
      font-size: 10px;
      padding: 3px 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, border-color 0.15s;
    }

    .con-item:hover .con-close-btn {
      opacity: 1;
    }

    .con-close-btn:hover {
      border-color: var(--fg);
      color: var(--fg);
    }

    .con-item-done-note {
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
      margin-top: 2px;
    }

    .dl-badge {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 2px;
      white-space: nowrap;
      letter-spacing: 0.2px;
      flex-shrink: 0;
    }

    .dl-overdue {
      background: var(--over-bg);
      color: var(--over-fg);
    }

    .dl-today {
      background: var(--soon-bg);
      color: var(--soon-fg);
    }

    .dl-upcoming {
      background: var(--chip);
      color: var(--muted);
    }

    .review-section {
      margin-bottom: 26px;
    }

    .review-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin: 0 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--faint);
      cursor: default;
    }

    .review-overdue { color: var(--over-fg); }
    .review-soon { color: var(--soon-fg); }
    .review-muted { color: var(--muted); cursor: pointer; }

    .review-num {
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      background: var(--surface-active);
      border-radius: 8px;
      padding: 0 7px;
    }

    details.review-section > summary { list-style: none; }
    details.review-section > summary::-webkit-details-marker { display: none; }
    details.review-section > summary::before {
      content: '▸';
      margin-right: 4px;
      font-size: 10px;
    }
    details.review-section[open] > summary::before { content: '▾'; }

    .rev-actions {
      white-space: nowrap;
      text-align: right;
    }

    .rev-btn {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      margin-left: 4px;
      border: 1px solid var(--faint);
      border-radius: 3px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .rev-btn:hover {
      background: var(--surface-active);
      color: var(--fg);
    }

    .rev-done:hover {
      background: #eaf6ea;
      color: #2e7d32;
      border-color: #cfe6cf;
    }

    @media (prefers-color-scheme: dark) {
      .rev-done:hover {
        background: #1f3322;
        color: #7ec98a;
        border-color: #2f5236;
      }
    }

    .review-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .person-item {
      padding: 12px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--faint);
      transition: background 0.1s;
    }

    .person-item:hover {
      background: var(--surface-hover);
    }

    .person-item-active {
      background: var(--surface-active);
      position: relative;
    }

    .person-item-active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 22%;
      bottom: 22%;
      width: 2px;
      background: var(--fg);
      border-radius: 2px;
    }

    .person-name {
      font-size: 12px;
      color: var(--fg);
      margin-bottom: 3px;
    }

    .person-count {
      font-size: 10px;
      color: var(--muted);
    }

    .person-back {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--faint);
      font-size: 11px;
      color: var(--muted);
      transition: color 0.1s;
    }

    .person-back:hover {
      color: var(--fg);
    }

    .person-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--faint);
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-hover);
    }


    /* Actions table in main frame */
    .actions-table-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 32px 44px;
      display: none;
      /* hidden by default */
    }

    .actions-table-wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .actions-table-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .actions-table-header h2 {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 500;
      color: var(--fg);
      letter-spacing: -0.3px;
    }

    .actions-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .actions-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 12px;
    }

    .actions-table thead {
      border-bottom: 2px solid var(--faint);
    }

    .actions-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .actions-table tbody tr {
      border-bottom: 1px solid var(--faint);
      cursor: pointer;
      transition: background 0.1s;
    }

    .actions-table tbody tr:hover {
      background: var(--surface-hover);
    }

    .actions-table tbody tr.row-done {
      opacity: 0.5;
    }

    .actions-table td {
      padding: 12px;
      vertical-align: middle;
    }

    .action-text {
      color: var(--fg);
      max-width: 400px;
    }

    .row-done .action-text {
      text-decoration: line-through;
    }

    .meeting-title {
      color: var(--muted);
      font-size: 11px;
    }

    .meeting-date {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .status-open,
    .status-done {
      font-size: 11px;
    }

    .status-done {
      color: var(--muted);
      font-style: italic;
    }

    .table-close-btn {
      background: var(--bg);
      border: 1px solid var(--faint);
      border-radius: var(--r);
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }

    .table-close-btn:hover {
      border-color: var(--fg);
      color: var(--fg);
    }

    /* hint */
    .hint {
      font-size: 10px;
      color: var(--subtle);
      line-height: 1.9;
      margin-top: 6px;
      font-style: italic;
    }

    .hint b {
      color: var(--muted);
      font-style: normal;
      font-weight: 400;
    }

    /* per-note inferred panel */
    .inferred {
      margin-top: 32px;
      border-top: 1px solid var(--faint);
      padding-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .inf-sec {
      display: flex;
      flex-direction: column;
    }

    .inf-lbl {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .inf-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--faint);
      font-size: 12px;
      line-height: 1.5;
    }

    .inf-row:last-child {
      border-bottom: none;
    }

    .inf-who {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      min-width: 72px;
      font-style: italic;
    }

    .inf-txt {
      color: var(--fg);
      flex: 1;
    }

    /* status bar */
    .statusbar {
      padding: 5px 44px;
      border-top: 1px solid var(--faint);
      font-size: 10px;
      color: var(--subtle);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
      letter-spacing: 0.2px;
    }

    .sdot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .sdot.saved {
      background: #3a9a5c;
    }

    .sdot.dirty {
      background: #e8a838;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--fg);
      color: var(--bg);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 99;
      letter-spacing: 0.3px;
    }

    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-btn {
      margin-left: 14px;
      padding: 0;
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.3px;
      color: var(--bg);
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.12s;
    }

    .toast-btn:hover {
      opacity: 0.7;
    }

    /* modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 28, 28, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(2px);
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg);
      border: 1px solid var(--faint);
      border-radius: var(--r);
      padding: 26px 30px;
      width: 340px;
      max-width: 90vw;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.09);
    }

    .modal h3 {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 7px;
    }

    .modal p {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .modal-input {
      width: 100%;
      border: 1px solid var(--faint);
      border-radius: var(--r);
      background: transparent;
      padding: 8px 10px;
      margin-bottom: 20px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg);
      outline: none;
      transition: border-color 0.12s;
    }

    .modal-input::placeholder {
      color: var(--subtle);
    }

    .modal-input:focus {
      border-color: var(--muted);
    }

    .modal-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .mb {
      padding: 7px 16px;
      border-radius: var(--r);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      border: 1px solid var(--faint);
      background: transparent;
      color: var(--muted);
      transition: color 0.12s, border-color 0.12s;
    }

    .mb:hover {
      border-color: var(--fg);
      color: var(--fg);
    }

    .mb.p {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }

    .mb.p:hover {
      opacity: 0.75;
    }

    /* ── TAG MODAL (cross-reference popup) ── */
    /* Inline clickable #tag / @mention inside the editor + read-only views */
    .tag-link,
    .person-link {
      color: var(--link);
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.1s;
    }

    .tag-link:hover,
    .person-link:hover {
      text-decoration: underline;
      background: var(--chip);
    }

    /* Backlinks ("Related threads") rows in the inferred panel */
    .backlink-row {
      font-size: 12px;
    }

    .backlink-meetings {
      color: var(--muted);
    }

    .backlink-mtg {
      cursor: pointer;
    }

    .backlink-mtg:hover {
      color: var(--fg);
      text-decoration: underline;
    }

    .backlink-meetings .sep {
      color: var(--subtle);
      margin: 0 5px;
    }

    .modal-wide {
      width: 560px;
      max-width: 92vw;
      max-height: 76vh;
      display: flex;
      flex-direction: column;
      padding: 22px 0 0;
    }

    .tagm-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 26px 14px;
      border-bottom: 1px solid var(--faint);
    }

    .tagm-head h3 {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
    }

    .tagm-sub {
      font-size: 10px;
      color: var(--muted);
      margin-left: 8px;
    }

    .tagm-close {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
    }

    .tagm-close:hover {
      color: var(--fg);
    }

    .tagm-body {
      overflow-y: auto;
      padding: 6px 0 14px;
    }

    .tagm-group-lbl {
      font-size: 9px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--subtle);
      padding: 12px 26px 6px;
    }

    .tagm-item {
      padding: 9px 26px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }

    .tagm-item:hover {
      background: var(--surface-hover);
      border-left-color: var(--link);
    }

    .tagm-item-text {
      font-size: 12px;
      line-height: 1.55;
      color: var(--fg);
    }

    .tagm-item.done .tagm-item-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-color: var(--subtle);
    }

    .tagm-item-text mark {
      background: transparent;
      color: var(--link);
      font-weight: 500;
    }

    .tagm-item-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
      font-size: 10px;
      color: var(--muted);
    }

    .tagm-item-meta .sep {
      color: var(--subtle);
    }

    .tagm-empty {
      padding: 26px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── TAGS ── */
    .ni-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }

    .tag-chip {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 9px;
      background: var(--chip);
      color: var(--muted);
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }

    .tag-chip:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .tag-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--faint);
      transition: background 0.1s;
    }

    .tag-item:hover {
      background: var(--surface-hover);
    }

    .tag-item-name {
      font-size: 12px;
      color: var(--fg);
    }

    .tag-item-count {
      font-size: 10px;
      color: var(--muted);
    }

    .tag-note-line {
      line-height: 1.6;
    }

    .tag-note-line + .tag-note-line {
      margin-top: 3px;
      padding-top: 3px;
      border-top: 1px solid var(--faint);
    }

    .tag-item-active {
      background: var(--surface-active);
      position: relative;
    }

    .tag-item-active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 22%;
      bottom: 22%;
      width: 2px;
      background: var(--fg);
      border-radius: 2px;
    }

    /* ── FOCUS ── keyboard focus ring (placed last so it overrides the
       per-element `outline: none` resets on inputs and the editor) */
    *:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 1px;
      border-radius: var(--r);
    }

    .notes-editable:focus-visible {
      outline-offset: 4px;
    }

    /* ── RESPONSIVE ──
       Wide layout is the two-pane default. Below 900px the generous 44px
       gutters tighten; below 640px the rail stacks above the editor as a
       capped, scrollable region so both panes fit a phone. */
    @media (max-width: 900px) {
      .rail { width: 180px; min-width: 180px; }
      .meta-bar { padding: 0 20px; }
      .title-wrap { padding: 22px 20px 0; }
      .scroller { padding: 16px 20px 40px; }
      .statusbar { padding: 5px 20px; }
      .actions-table-container { padding: 24px 20px; }
    }

    @media (max-width: 640px) {
      .shell { flex-direction: column; }
      .rail {
        width: 100%;
        min-width: 0;
        max-height: 42vh;
        border-right: none;
        border-bottom: 1px solid var(--faint);
      }
      .main { min-height: 0; }
      /* Reveal hover-only row controls on touch (no :hover to trigger them) */
      .inf-close-btn,
      .con-close-btn { opacity: 1; }
      .title-inp { font-size: 22px; }
    }

    @media (hover: none) {
      .inf-close-btn,
      .con-close-btn { opacity: 1; }
    }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="shell">

    <!-- RAIL -->
    <nav class="rail">
      <div class="rail-top">
        <span class="wordmark">Minutes</span>
        <button class="btn-new" onclick="app.newNote()">+ new meeting</button>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="search…">
      </div>
      <div class="rail-tabs" role="tablist" aria-label="Views">
        <button class="rail-tab active" data-tab="notes" role="tab" aria-selected="true">Notes</button>
        <button class="rail-tab" data-tab="actions" role="tab" aria-selected="false">Actions</button>
        <button class="rail-tab" data-tab="tags" role="tab" aria-selected="false">Tags</button>
      </div>

      <div class="note-list visible" id="note-list"></div>

      <div class="consolidated" id="con-actions">
        <div class="con-filter">
          <input type="text" id="filter-actions" placeholder="filter actions…">
        </div>
        <div class="con-list" id="list-actions">
          <!-- Person list shown by default, detail view shown when person clicked -->
        </div>
      </div>

      <div class="consolidated" id="con-tags">
        <div class="con-filter">
          <input type="text" id="filter-tags" placeholder="filter tags…">
        </div>
        <div class="con-list" id="list-tags"></div>
      </div>

      <div class="rail-foot">
        <button class="rb" onclick="app.exportData()">↑ export</button>
        <button class="rb" onclick="document.getElementById('file-import').click()">↓ import</button>
        <input type="file" id="file-import" class="file-import-hidden" accept=".json" onchange="app.importData(this)">
      </div>
    </nav>

    <!-- MAIN -->
    <main class="main">
      <div class="empty" id="empty">select or create a meeting note</div>

      <div class="editor" id="editor" style="display:none">
        <div class="meta-bar">
          <div class="mf">
            <span class="ml">Date</span>
            <input type="date" class="mi" id="f-date">
          </div>
          <div class="mf">
            <span class="ml">Time</span>
            <input type="time" class="mi" id="f-time">
          </div>
          <div class="meta-gap"></div>
          <button class="del-btn" onclick="app.confirmDelete()">delete</button>
        </div>

        <div class="title-wrap">
          <input type="text" class="title-inp" id="f-title" placeholder="Meeting title">
        </div>

        <div class="scroller">
          <div class="notes-lbl">Notes</div>
          <div class="notes-editor">
            <div class="notes-editable" id="f-notes" contenteditable="true" spellcheck="true"></div>
          </div>
          <div class="hint">
            <b>@name task</b> → action &nbsp;·&nbsp; <b>→ text</b> or <b>** text</b> → decision &nbsp;·&nbsp;
            <b>!YYYY-MM-DD</b> → deadline &nbsp;·&nbsp; <b>!today</b> <b>!tomorrow</b> <b>!nextweek</b> → shortcuts &nbsp;·&nbsp; <b>#tag</b> → tag
          </div>
          <div class="inferred" id="inferred" style="display:none">
            <div class="inf-sec" id="act-sec" style="display:none">
              <div class="inf-lbl">Actions</div>
              <div id="act-list"></div>
            </div>
            <div class="inf-sec" id="dec-sec" style="display:none">
              <div class="inf-lbl">Decisions</div>
              <div id="dec-list"></div>
            </div>
            <div class="inf-sec" id="link-sec" style="display:none">
              <div class="inf-lbl">Related threads</div>
              <div id="link-list"></div>
            </div>
          </div>
        </div>

        <div class="statusbar">
          <div class="sdot" id="sdot"></div>
          <span id="stxt">—</span>
        </div>
      </div>
    </main>
  </div>

  <!-- delete modal -->
  <div class="overlay" id="del-modal">
    <div class="modal">
      <h3>Delete note?</h3>
      <p>This cannot be undone.</p>
      <div class="modal-btns">
        <button class="mb" onclick="app.closeModal()">cancel</button>
        <button class="mb p" onclick="app.doDelete()">delete</button>
      </div>
    </div>
  </div>

  <!-- generic input modal (closure notes / reschedule) -->
  <div class="overlay" id="input-modal">
    <div class="modal">
      <h3 id="im-title">—</h3>
      <input class="modal-input" id="im-input" autocomplete="off">
      <div class="modal-btns">
        <button class="mb" id="im-cancel">cancel</button>
        <button class="mb p" id="im-ok">ok</button>
      </div>
    </div>
  </div>

  <!-- tag cross-reference modal -->
  <div class="overlay" id="tag-modal">
    <div class="modal modal-wide">
      <div class="tagm-head">
        <h3 id="tagm-title">#tag<span class="tagm-sub" id="tagm-sub"></span></h3>
        <button class="tagm-close" id="tagm-close" aria-label="close">✕</button>
      </div>
      <div class="tagm-body" id="tagm-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      'use strict';

      // ── DATA STORE ──
      // Shape: { meetings: { [id]: Meeting }, actions: Action[], decisions: Decision[] }
      //
      // Meeting:  { id, title, date, time, notes, createdAt, updatedAt }
      // Action:   { meetingId, meetingTitle, meetingDate, owners: string[], text }
      // Decision: { meetingId, meetingTitle, meetingDate, text }
      //
      // actions[] and decisions[] are denormalized — derived from meeting notes on
      // every save so the consolidated view reads directly without scanning all notes.

      const DB_NAME = 'minutes_db';
      const DB_STORE = 'kv';
      const DB_KEY = 'minutes_v1';
      let _db = null;

      function openDB() {
        if (_db) return Promise.resolve(_db);
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
          req.onsuccess = e => { _db = e.target.result; resolve(_db); };
          req.onerror = () => reject(req.error);
        });
      }

      async function loadData() {
        try {
          const db = await openDB();
          const result = await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readonly');
            const req = tx.objectStore(DB_STORE).get(DB_KEY);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
          if (result) return result;
        } catch (e) { console.warn('IndexedDB load failed:', e); }
        return null;
      }

      async function saveData() {
        try {
          const db = await openDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readwrite');
            const req = tx.objectStore(DB_STORE).put(data, DB_KEY);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
          });
        } catch (e) { console.warn('IndexedDB save failed:', e); }
      }

      let data = { meetings: {}, actions: [], decisions: [] };

      function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

      // Recompute denormalized actions/decisions for one meeting.
      // Removes stale entries for that meeting then re-inserts from current notes.
      function indexMeeting(meeting) {
        data.actions = data.actions.filter(a => a.meetingId !== meeting.id);
        data.decisions = data.decisions.filter(d => d.meetingId !== meeting.id);
        meeting.tags = parseTags(meeting.notes || '');

        for (const a of parseActions(meeting.notes || '')) {
          data.actions.push({
            meetingId: meeting.id,
            meetingTitle: meeting.title || 'Untitled',
            meetingDate: meeting.date || '',
            owners: a.owners,
            text: a.text,
            fullText: a.fullText,
            isDone: a.isDone,
            doneNote: a.doneNote,
            deadline: a.deadline,
          });
        }
        for (const text of parseDecisions(meeting.notes || '')) {
          data.decisions.push({
            meetingId: meeting.id,
            meetingTitle: meeting.title || 'Untitled',
            meetingDate: meeting.date || '',
            text,
          });
        }
      }

      // Remove all index entries for a meeting by id (used on delete)
      function clearIndex(id) {
        data.actions = data.actions.filter(a => a.meetingId !== id);
        data.decisions = data.decisions.filter(d => d.meetingId !== id);
      }

      // ── STATE ──
      let currentId = null, isDirty = false, toastTmr = null;
      let activeTab = 'notes';

      // ── DOM REFS ──
      const elNotes = document.getElementById('f-notes');
      const elEmpty = document.getElementById('empty');
      const elEditor = document.getElementById('editor');
      const elSdot = document.getElementById('sdot');
      const elStxt = document.getElementById('stxt');
      const elList = document.getElementById('note-list');
      const elDelModal = document.getElementById('del-modal');
      const elToast = document.getElementById('toast');
      const elSearch = document.getElementById('search');
      const elSearchBox = document.querySelector('.search-box');
      const elTitle = document.getElementById('f-title');
      const elDate = document.getElementById('f-date');
      const elTime = document.getElementById('f-time');
      const elInferred = document.getElementById('inferred');
      const elActSec = document.getElementById('act-sec');
      const elDecSec = document.getElementById('dec-sec');
      const elActList = document.getElementById('act-list');
      const elDecList = document.getElementById('dec-list');
      const elLinkSec = document.getElementById('link-sec');
      const elLinkList = document.getElementById('link-list');
      const elConActions = document.getElementById('con-actions');
      const elListActions = document.getElementById('list-actions');
      const elFilterActions = document.getElementById('filter-actions');
      const elConTags = document.getElementById('con-tags');
      const elListTags = document.getElementById('list-tags');
      const elFilterTags = document.getElementById('filter-tags');

      // ── RAIL TABS ──
      document.querySelectorAll('.rail-tab').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.rail-tab').forEach(b => {
          const on = b.dataset.tab === tab;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        elList.classList.toggle('visible', tab === 'notes');
        elConActions.classList.toggle('visible', tab === 'actions');
        elConTags.classList.toggle('visible', tab === 'tags');

        // The rail search only filters the notes list; hide it on other tabs
        // (each consolidated panel has its own filter input).
        elSearchBox.style.display = (tab === 'notes') ? '' : 'none';

        // Hide table container when switching away from actions
        const tableContainer = document.getElementById('actions-table-container');
        if (tableContainer) {
          tableContainer.style.display = (tab === 'actions' && actionsView.mode !== 'list') ? 'block' : 'none';
        }

        // Hide tags table container when switching away from tags
        const tagsTableContainer = document.getElementById('tags-table-container');
        if (tagsTableContainer) {
          tagsTableContainer.style.display = (tab === 'tags' && tagsView.mode === 'detail') ? 'block' : 'none';
        }

        // Show/hide editor and empty state based on tab
        if (tab === 'notes') {
          // Switching to notes - show editor if there's a currentId, otherwise show empty
          if (currentId) {
            elEditor.style.display = 'flex';
            elEmpty.style.display = 'none';
          } else {
            elEditor.style.display = 'none';
            elEmpty.style.display = 'flex';
            elEmpty.textContent = 'select or create a meeting note';
          }
        }

        if (tab === 'tags' && tagsView.mode === 'detail') {
          elEditor.style.display = 'none';
          elEmpty.style.display = 'none';
          // Re-show tags table in case it was hidden when a note was opened inline
          const tc = document.getElementById('tags-table-container');
          if (tc) tc.style.display = 'block';
        }

        if (tab === 'actions') renderConsolidated('actions');
        if (tab === 'tags') renderTagsPanel();
      }

      // ── CONSOLIDATED VIEW ──
      // Render person list in Actions tab
      function renderActionsByPerson() {
        const q = elFilterActions.value.toLowerCase();

        // Group actions by person
        const byPerson = {};
        for (const a of data.actions) {
          for (const owner of a.owners) {
            if (q && !owner.toLowerCase().includes(q)) continue;
            if (!byPerson[owner]) byPerson[owner] = [];
            byPerson[owner].push(a);
          }
        }

        const people = Object.keys(byPerson).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

        // Top-level nav: Review inbox + All actions, always shown.
        const { overdue, dueSoon } = reviewItems();
        const reviewN = overdue.length + dueSoon.length;
        const reviewBadge = reviewN
          ? ` &nbsp;<span class="dl-badge ${overdue.length ? 'dl-overdue' : 'dl-today'}">${reviewN}</span>`
          : '';
        const openTotal = data.actions.filter(a => !a.isDone).length;
        const navHtml = `
      <div class="person-item${actionsView.mode === 'review' ? ' person-item-active' : ''}" onclick="app.showReview()">
        <div class="person-name">⚑ Review${reviewBadge}</div>
        <div class="person-count">${reviewN ? `${reviewN} need${reviewN === 1 ? 's' : ''} attention` : 'all clear'}</div>
      </div>
      <div class="person-item${actionsView.mode === 'all' ? ' person-item-active' : ''}" onclick="app.showAllActions()">
        <div class="person-name">All actions</div>
        <div class="person-count">${openTotal} open</div>
      </div>`;

        if (!people.length) {
          elListActions.innerHTML = navHtml;
          return;
        }

        const today = new Date().toISOString().slice(0, 10);
        elListActions.innerHTML = navHtml + people.map(person => {
          const actions = byPerson[person];
          const openCount = actions.filter(a => !a.isDone).length;
          const doneCount = actions.filter(a => a.isDone).length;
          const overdueCount = actions.filter(a => !a.isDone && a.deadline && a.deadline < today).length;
          const isSelected = actionsView.mode === 'detail' && actionsView.selectedPerson === person;
          const overdueTag = overdueCount ? ` &nbsp;<span class="dl-badge dl-overdue">${overdueCount} overdue</span>` : '';
          return `
      <div class="person-item${isSelected ? ' person-item-active' : ''}" onclick="app.showPersonActions('${esc(person)}')">
        <div class="person-name">@${esc(person)}</div>
        <div class="person-count">${openCount} open${overdueTag}${doneCount ? `, ${doneCount} done` : ''}</div>
      </div>`;
        }).join('');
      }

      // Render action list for a specific person - show sidebar + main table
      function renderActionsForPerson(person) {
        const q = elFilterActions.value.toLowerCase();
        const actions = data.actions
          .filter(a => a.owners.includes(person) && (!q || a.text.toLowerCase().includes(q)))
          .sort((a, b) => (b.meetingDate || '').localeCompare(a.meetingDate || ''));

        // Keep showing the full person list in the sidebar, but highlight the selected person
        // The renderActionsByPerson function will handle this by checking actionsView.selectedPerson

        // Show table in main frame
        if (!actions.length) {
          elEmpty.style.display = 'flex';
          elEmpty.textContent = 'No actions for @' + person;
          elEditor.style.display = 'none';
          return;
        }

        elEmpty.style.display = 'none';
        elEditor.style.display = 'none';

        // Show table
        let tableHTML = `
    <div class="actions-table-wrap">
      <div class="actions-table-header">
        <h2>Actions for @${esc(person)}</h2>
        <span class="actions-count">${actions.length} items</span>
      </div>
      <table class="actions-table">
        <thead>
          <tr>
            <th>Action</th>
            <th>Deadline</th>
            <th>Meeting</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
  `;

        for (const a of actions) {
          const statusCell = a.isDone
            ? `<td class="status-done">${esc(a.doneNote)}</td>`
            : `<td class="status-open"><button class="table-close-btn" data-action="${esc(JSON.stringify(a))}" onclick="app.closeActionFromTable(this, '${a.meetingId}')">Mark done</button></td>`;

          tableHTML += `
      <tr class="${a.isDone ? 'row-done' : ''}" onclick="app.openNote('${a.meetingId}', true)">
        <td class="action-text">${esc(a.text)}</td>
        <td>${deadlineBadge(a.deadline)}</td>
        <td class="meeting-title">${esc(a.meetingTitle || 'Untitled')}</td>
        <td class="meeting-date">${a.meetingDate ? fmtDate(a.meetingDate) : '—'}</td>
        ${statusCell}
      </tr>
    `;
        }

        tableHTML += `
        </tbody>
      </table>
    </div>
  `;

        // Insert table into main area (after .editor)
        const main = document.querySelector('.main');
        let tableContainer = document.getElementById('actions-table-container');
        if (!tableContainer) {
          tableContainer = document.createElement('div');
          tableContainer.id = 'actions-table-container';
          tableContainer.className = 'actions-table-container';
          main.appendChild(tableContainer);
        }
        tableContainer.innerHTML = tableHTML;
        tableContainer.style.display = 'block';
      }

      // Render all actions sorted by deadline (asc), then meeting date (asc) for missing deadline
      function renderAllActions() {
        const q = elFilterActions.value.toLowerCase();

        let actions = data.actions.slice();
        if (q) {
          actions = actions.filter(a =>
            a.text.toLowerCase().includes(q) ||
            a.owners.some(o => o.toLowerCase().includes(q))
          );
        }

        actions.sort((a, b) => {
          const ad = a.deadline, bd = b.deadline;
          if (ad && bd) return ad.localeCompare(bd);
          if (ad) return -1;
          if (bd) return 1;
          return (a.meetingDate || '').localeCompare(b.meetingDate || '');
        });

        const main = document.querySelector('.main');
        let tableContainer = document.getElementById('actions-table-container');
        if (!tableContainer) {
          tableContainer = document.createElement('div');
          tableContainer.id = 'actions-table-container';
          tableContainer.className = 'actions-table-container';
          main.appendChild(tableContainer);
        }

        if (!actions.length) {
          elEmpty.style.display = 'flex';
          elEmpty.textContent = 'no actions yet';
          elEditor.style.display = 'none';
          tableContainer.style.display = 'none';
          return;
        }

        elEmpty.style.display = 'none';
        elEditor.style.display = 'none';

        let tableHTML = `
    <div class="actions-table-wrap">
      <div class="actions-table-header">
        <h2>All Actions</h2>
        <span class="actions-count">${actions.length} item${actions.length !== 1 ? 's' : ''}</span>
      </div>
      <table class="actions-table">
        <thead>
          <tr>
            <th>Action</th>
            <th>Deadline</th>
            <th>Assigned to</th>
            <th>Meeting</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
  `;

        for (const a of actions) {
          const statusCell = a.isDone
            ? `<td class="status-done">${esc(a.doneNote)}</td>`
            : `<td class="status-open"><button class="table-close-btn" data-action="${esc(JSON.stringify(a))}" onclick="app.closeActionFromTable(this, '${a.meetingId}')">Mark done</button></td>`;
          const ownersDisplay = a.owners.map(o => `@${esc(o)}`).join(', ');
          tableHTML += `
      <tr class="${a.isDone ? 'row-done' : ''}" onclick="app.openNote('${a.meetingId}', true)">
        <td class="action-text">${esc(a.text)}</td>
        <td>${deadlineBadge(a.deadline)}</td>
        <td class="action-owners">${ownersDisplay}</td>
        <td class="meeting-title">${esc(a.meetingTitle || 'Untitled')}</td>
        <td class="meeting-date">${a.meetingDate ? fmtDate(a.meetingDate) : '—'}</td>
        ${statusCell}
      </tr>
    `;
        }

        tableHTML += `
        </tbody>
      </table>
    </div>
  `;

        tableContainer.innerHTML = tableHTML;
        tableContainer.style.display = 'block';
      }

      // Track current view state for actions tab
      // Default to the Review inbox so opening Actions lands on what's due.
      let actionsView = { mode: 'review', selectedPerson: null };

      // Track current view state for tags tab
      let tagsView = { mode: 'list', selectedTag: null };

      function renderConsolidated(type) {
        if (actionsView.mode === 'review') {
          renderActionsByPerson();
          renderReview();
        } else if (actionsView.mode === 'all') {
          renderActionsByPerson();
          renderAllActions();
        } else if (actionsView.mode === 'list') {
          renderActionsByPerson();
        } else {
          renderActionsByPerson();
          renderActionsForPerson(actionsView.selectedPerson);
        }
      }

      elFilterActions.addEventListener('input', () => {
        if (actionsView.mode === 'review') { renderActionsByPerson(); renderReview(); }
        else if (actionsView.mode === 'all') { renderActionsByPerson(); renderAllActions(); }
        else if (actionsView.mode === 'list') renderActionsByPerson();
        else renderActionsForPerson(actionsView.selectedPerson);
      });
      elFilterTags.addEventListener('input', renderTagsPanel);

      // Input event listener is already set up in the contenteditable keyboard handlers section

      function onNotesChange(text) {

        const actions = parseActions(text);
        const decisions = parseDecisions(text);
        updateInferred(actions, decisions);
        updateStatusBar(elDate.value, actions, decisions);
        markDirty(text);
      }


      // ── CONTENTEDITABLE HELPERS ──
      // Convert plain text (with \n and \t) to HTML list structure
      function textToHTML(text) {
        if (!text.trim()) return '';

        // Flat ordered list — one <li> per non-empty line. Leading tabs from
        // legacy (indented) notes are stripped so old data flattens cleanly.
        const items = text.split('\n')
          .map(line => line.replace(/^\t+/, '').trim())
          .filter(Boolean);

        if (!items.length) return '';

        return '<ol>' + items.map(c => `<li>${renderNoteLine(c)}</li>`).join('') + '</ol>';
      }

      // Escape a note line and wrap #tags and @mentions as clickable
      // cross-reference links. The regexes run on the *escaped* string; tag /
      // name chars and the '#' '@' sigils are untouched by esc(), so matching
      // stays accurate and we never split a numeric entity like &#39; (the digit
      // after '#' fails the [a-z] start). Round-trips cleanly: htmlToText reads
      // each span's textContent ("#tag" / "@name").
      function renderNoteLine(line) {
        return esc(line)
          .replace(/#([a-zA-Z][a-zA-Z0-9_-]*)/g,
            (_m, tag) => `<span class="tag-link" data-tag="${tag.toLowerCase()}">#${tag}</span>`)
          .replace(/@([a-zA-Z0-9_.+-]+)/g,
            (_m, name) => `<span class="person-link" data-person="${name.toLowerCase()}">@${name}</span>`);
      }

      // Convert HTML list structure back to plain text. One line per <li>;
      // any nested lists from legacy notes are flattened to top level.
      function htmlToText(html) {
        const temp = document.createElement('div');
        temp.innerHTML = html;

        const lines = [];
        for (const li of temp.querySelectorAll('li')) {
          let text = '';
          for (const child of li.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
              text += child.textContent;
            } else if (child.tagName === 'BR') {
              text += '\n';
            } else if (child.tagName !== 'UL' && child.tagName !== 'OL') {
              text += child.textContent;
            }
          }
          const trimmed = text.trim();
          if (trimmed) lines.push(trimmed);
        }
        return lines.join('\n');
      }

      // ── CONTENTEDITABLE KEYBOARD HANDLERS ──
      elNotes.addEventListener('keydown', e => {
        // Expand !today / !tomorrow / !nextweek shortcuts on Space or Enter
        if (e.key === ' ' || e.key === 'Enter') {
          const sel = window.getSelection();
          if (sel.rangeCount) {
            const range = sel.getRangeAt(0);
            if (range.startContainer.nodeType === Node.TEXT_NODE) {
              const textNode = range.startContainer;
              const offset = range.startOffset;
              const textBefore = textNode.textContent.slice(0, offset);
              const m = textBefore.match(/!(today|tomorrow|nextweek)$/i);
              if (m) {
                e.preventDefault();
                const expanded = expandDeadlineShortcuts('!' + m[1]);
                const start = offset - m[0].length;
                const suffix = e.key === ' ' ? ' ' : '';
                textNode.textContent =
                  textNode.textContent.slice(0, start) + expanded + suffix +
                  textNode.textContent.slice(offset);
                const newRange = document.createRange();
                newRange.setStart(textNode, start + expanded.length + suffix.length);
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
                elNotes.dispatchEvent(new Event('input'));
                if (e.key === 'Enter') {
                  // Fall through to normal Enter handling by re-dispatching
                  elNotes.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
                }
                return;
              }
            }
          }
        }

        // Handle Enter: create new <li> at same nesting level
        if (e.key === 'Enter') {
          e.preventDefault();
          const sel = window.getSelection();
          const range = sel.getRangeAt(0);
          const currentLi = range.startContainer.nodeType === Node.TEXT_NODE
            ? range.startContainer.parentElement.closest('li')
            : range.startContainer.closest('li');

          if (currentLi) {
            // Extract content after cursor into the new li
            const splitRange = document.createRange();
            splitRange.setStart(range.endContainer, range.endOffset);
            splitRange.setEnd(currentLi, currentLi.childNodes.length);
            const afterContent = splitRange.extractContents();

            const newLi = document.createElement('li');
            const hasContent = afterContent.textContent.length > 0 || afterContent.querySelector('ul, ol');
            if (hasContent) {
              newLi.appendChild(afterContent);
            } else {
              newLi.innerHTML = '<br>';
            }

            // Ensure current li has a placeholder if now empty
            if (!currentLi.textContent && !currentLi.querySelector('ul, ol, br')) {
              currentLi.innerHTML = '<br>';
            }

            currentLi.parentElement.insertBefore(newLi, currentLi.nextSibling);

            // Move cursor to start of new li
            const newRange = document.createRange();
            newRange.setStart(newLi, 0);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);

            elNotes.dispatchEvent(new Event('input'));
          }
        }
      });

      elNotes.addEventListener('input', () => onNotesChange(htmlToText(elNotes.innerHTML)));

      // Delegated, document-wide: clicking any rendered #tag or @mention link —
      // in the editor, the inferred panel, or the backlinks list — opens its
      // cross-reference modal. In the editor the caret still lands where clicked,
      // so the note stays editable; close the modal (Esc / ✕) to keep typing.
      // Freshly typed tokens become links after the note re-renders on reopen.
      document.addEventListener('click', e => {
        const tag = e.target.closest('.tag-link');
        if (tag) { openTagModal(tag.dataset.tag); return; }
        const person = e.target.closest('.person-link');
        if (person) { openPersonModal(person.dataset.person); return; }
      });

      // ── DEADLINE SHORTCUTS ──
      function expandDeadlineShortcuts(text) {
        const today = new Date();
        const fmt = d => d.toISOString().slice(0, 10);
        const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
        const nextWeek = new Date(today); nextWeek.setDate(today.getDate() + 7);
        return text
          .replace(/!today\b/gi,    `!${fmt(today)}`)
          .replace(/!tomorrow\b/gi, `!${fmt(tomorrow)}`)
          .replace(/!nextweek\b/gi, `!${fmt(nextWeek)}`);
      }

      // ── PARSE ──
      function parseActions(text) {
        const out = [];
        for (const raw of text.split('\n')) {
          const line = raw.replace(/^\t+/, '').trim();
          if (!line) continue;
          const mentions = [...line.matchAll(/@([a-zA-Z0-9_.+-]+)/g)];
          if (!mentions.length) continue;

          // Keep full text (with @mentions intact) for display
          let fullText = line.replace(/^[→\-\*\d.]+\s*/, '').replace(/\s+/g, ' ').trim();

          // Expand deadline shortcuts before extracting
          fullText = expandDeadlineShortcuts(fullText);

          // Extract deadline marker: !YYYY-MM-DD
          const deadlineMatch = fullText.match(/!(\d{4}-\d{2}-\d{2})/);
          const deadline = deadlineMatch ? deadlineMatch[1] : null;

          // Check for completion marker: [done: ...] or [closed: ...]
          const doneMatch = fullText.match(/\[(done|closed):\s*(.+?)\]\s*$/i);
          const isDone = !!doneMatch;
          const doneNote = doneMatch ? doneMatch[2].trim() : '';

          // Strip markers from display text
          let displayText = isDone ? fullText.replace(/\[(done|closed):.+?\]\s*$/i, '').trim() : fullText;
          displayText = displayText.replace(/!\d{4}-\d{2}-\d{2}/g, '').replace(/\s+/g, ' ').trim();

          if (displayText) {
            out.push({
              owners: mentions.map(m => m[1].toLowerCase()),
              text: displayText,
              fullText: fullText,  // original with marker intact
              isDone,
              doneNote,
              deadline,
            });
          }
        }
        return out;
      }

      function parseTags(text) {
        const tags = new Set();
        for (const m of (text || '').matchAll(/#([a-zA-Z][a-zA-Z0-9_-]*)/g)) {
          tags.add(m[1].toLowerCase());
        }
        return [...tags].sort();
      }

      function parseDecisions(text) {
        const out = [];
        for (const raw of text.split('\n')) {
          const line = raw.replace(/^\t+/, '').trim();
          if (!line) continue;
          if (/^(→|>>|\*\*|decided:|decision:)/i.test(line)) {
            const clean = line.replace(/^(→|>>|\*\*|decided:|decision:)/i, '').replace(/\*\*$/, '').trim();
            if (clean) out.push(clean);
          }
        }
        return out;
      }

      // Update per-note inferred panel from pre-parsed results
      function updateInferred(actions, decisions) {
        if (actions.length) {
          // Sort by first owner name for consistent display
          const sorted = actions.slice().sort((a, b) => {
            const ownerA = (a.owners[0] || '').toLowerCase();
            const ownerB = (b.owners[0] || '').toLowerCase();
            return ownerA.localeCompare(ownerB);
          });
          elActList.innerHTML = sorted.map(a =>
            `<div class="inf-row${a.isDone ? ' inf-row-done' : ''}">
        <span class="inf-who">${a.owners.join(', ')}</span>
        <span class="inf-txt">${esc(a.text.replace(/@/g, ''))}</span>
        ${a.deadline ? deadlineBadge(a.deadline) : ''}
        ${a.isDone
              ? `<span class="inf-done-note">${esc(a.doneNote)}</span>`
              : `<button class="inf-close-btn" onclick="app.closeAction(this)" data-fulltext="${esc(a.fullText)}" title="Mark done">✓</button>`
            }
      </div>`).join('');
          elActSec.style.display = '';
        } else {
          elActSec.style.display = 'none';
        }

        if (decisions.length) {
          elDecList.innerHTML = decisions.map(d =>
            `<div class="inf-row"><span class="inf-txt">${esc(d)}</span></div>`).join('');
          elDecSec.style.display = '';
        } else {
          elDecSec.style.display = 'none';
        }

        const hasLinks = renderBacklinks();
        elInferred.style.display = (actions.length || decisions.length || hasLinks) ? '' : 'none';
      }

      // Backlinks: for each tag on the current note, surface other meetings that
      // share it, so cross-references are visible without leaving the editor.
      // Tags are read live from the editor so they stay fresh while typing.
      // Returns true when any related thread was rendered.
      function renderBacklinks() {
        const tags = currentId ? parseTags(htmlToText(elNotes.innerHTML)) : [];
        const rows = [];
        for (const tag of tags) {
          const others = Object.values(data.meetings)
            .filter(m => m.id !== currentId && (m.tags || []).includes(tag))
            .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          if (others.length) rows.push({ tag, others });
        }
        if (!rows.length) { elLinkSec.style.display = 'none'; elLinkList.innerHTML = ''; return false; }
        elLinkList.innerHTML = rows.map(r => `
      <div class="inf-row backlink-row">
        <span class="tag-link" data-tag="${esc(r.tag)}">#${esc(r.tag)}</span>
        <span class="backlink-meetings">${r.others
          .map(m => `<span class="backlink-mtg" onclick="app.openNote('${m.id}', true)">${esc(m.title || 'Untitled')}</span>`)
          .join('<span class="sep">·</span>')}</span>
      </div>`).join('');
        elLinkSec.style.display = '';
        return true;
      }

      // ── SIDEBAR NOTE LIST ──
      function renderList() {
        updateReviewBadge();
        const q = elSearch.value.toLowerCase().trim();
        let meetings = Object.values(data.meetings)
          .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

        if (q) {
          if (q.startsWith('#')) {
            const tag = q.slice(1);
            meetings = meetings.filter(m => (m.tags || []).includes(tag));
          } else {
            meetings = meetings.filter(m =>
              (m.title || '').toLowerCase().includes(q) ||
              (m.notes || '').toLowerCase().includes(q) ||
              (m.tags || []).some(t => t.includes(q))
            );
          }
        }

        if (!meetings.length) {
          elList.innerHTML = `<div class="list-empty">${q ? 'no results' : 'no notes yet'}</div>`;
          return;
        }
        elList.innerHTML = meetings.map(m => {
          const sub = m.date ? fmtDate(m.date) : '';
          const tags = m.tags || [];
          const tagHtml = tags.length
            ? `<div class="ni-tags">${tags.map(t => `<span class="tag-chip" onclick="event.stopPropagation();app.filterByTag('${esc(t)}')">#${esc(t)}</span>`).join('')}</div>`
            : '';
          return `<div class="ni${m.id === currentId ? ' active' : ''}" onclick="app.openNote('${m.id}')">
      <div class="ni-title">${esc(m.title || 'Untitled')}</div>
      ${sub ? `<div class="ni-sub">${esc(sub)}</div>` : ''}
      ${tagHtml}
    </div>`;
        }).join('');
      }

      // ── OPEN / NEW / SAVE / DELETE ──
      function openNote(id, keepTab = false) {
        clearTimeout(noteTimer.t); clearTimeout(metaTimer.t);
        // Fix 4: flush both save paths so no changes are lost on note switch
        if (isDirty && currentId) { saveMeta(); saveNote(htmlToText(elNotes.innerHTML)); }

        // Fix 7: set currentId before switchTab so any reads during tab switch see the new id
        currentId = id;

        // Switch to notes tab unless keepTab is true (e.g. when peeking from Actions tab)
        if (!keepTab && activeTab !== 'notes') switchTab('notes');
        const m = data.meetings[id];
        if (!m) return;

        elEmpty.style.display = 'none';
        elEditor.style.display = 'flex';

        // When opening a note from within the tags tab, hide the tags table so
        // the editor fills the full main area. Clicking any tag restores the table.
        if (activeTab === 'tags') {
          const tc = document.getElementById('tags-table-container');
          if (tc) tc.style.display = 'none';
        }

        elTitle.value = m.title || '';
        elDate.value = m.date || '';
        elTime.value = m.time || '';

        const notes = m.notes || '';
        elNotes.innerHTML = textToHTML(notes) || '<ol><li><br></li></ol>';
        elNotes.dataset.placeholder = 'write your first note…';

        const actions = parseActions(notes);
        const decisions = parseDecisions(notes);
        updateInferred(actions, decisions);
        updateStatusBar(m.date, actions, decisions);
        setDirty(false);
        renderList();
      }

      function newNote() {
        clearTimeout(noteTimer.t); clearTimeout(metaTimer.t);
        // Fix 4: flush both save paths before creating new note
        if (isDirty && currentId) { saveMeta(); saveNote(htmlToText(elNotes.innerHTML)); }

        const id = newId();
        const now = new Date();
        data.meetings[id] = {
          id,
          title: '', notes: '',
          date: now.toISOString().slice(0, 10),
          time: now.toTimeString().slice(0, 5),
          createdAt: now.toISOString(),
          updatedAt: now.toISOString(),
        };
        saveData();
        openNote(id);
        elTitle.focus();
      }

      // saveNote: write notes text, reindex, persist. Does NOT redraw the list
      // (title/date didn't change) but does refresh consolidated panels if open.
      function saveNote(notesText) {
        if (!currentId) return;
        const m = data.meetings[currentId];
        if (!m) return;
        // If notesText is not provided, extract from contenteditable
        if (!notesText) notesText = htmlToText(elNotes.innerHTML);
        noteTimer.t = null;
        m.notes = notesText;
        m.updatedAt = new Date().toISOString();
        indexMeeting(m);
        saveData();
        if (!metaTimer.t) setDirty(false);
        updateReviewBadge();
        if (activeTab === 'actions') renderConsolidated('actions');
      }

      // saveMeta: write title/date/time, reindex, redraw list.
      function saveMeta() {
        if (!currentId) return;
        const m = data.meetings[currentId];
        if (!m) return;
        metaTimer.t = null;
        m.title = elTitle.value;
        m.date = elDate.value;
        m.time = elTime.value;
        m.updatedAt = new Date().toISOString();
        indexMeeting(m);
        saveData();
        if (!noteTimer.t) setDirty(false);
        renderList();
        if (activeTab === 'actions') renderConsolidated('actions');
      }

      function confirmDelete() { elDelModal.classList.add('open'); }
      function closeModal() { elDelModal.classList.remove('open'); }

      // ── INPUT MODAL ──
      // Styled replacement for window.prompt(). Resolves to the entered
      // string, or null if cancelled (Escape / cancel / backdrop click).
      const elInputModal = document.getElementById('input-modal');
      const elImTitle = document.getElementById('im-title');
      const elImInput = document.getElementById('im-input');
      const elImOk = document.getElementById('im-ok');
      const elImCancel = document.getElementById('im-cancel');
      let _imResolve = null;

      function inputModal({ title, type = 'text', initial = '', placeholder = '', confirmText = 'ok' }) {
        return new Promise(resolve => {
          _imResolve = resolve;
          elImTitle.textContent = title;
          elImInput.type = type;
          elImInput.value = initial;
          elImInput.placeholder = placeholder;
          elImOk.textContent = confirmText;
          elInputModal.classList.add('open');
          requestAnimationFrame(() => {
            elImInput.focus();
            if (type === 'text') elImInput.select();
          });
        });
      }

      function resolveInputModal(val) {
        if (!_imResolve) return;
        elInputModal.classList.remove('open');
        const done = _imResolve; _imResolve = null;
        done(val);
      }

      elImOk.addEventListener('click', () => resolveInputModal(elImInput.value));
      elImCancel.addEventListener('click', () => resolveInputModal(null));
      elInputModal.addEventListener('click', e => { if (e.target === elInputModal) resolveInputModal(null); });
      elImInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); resolveInputModal(elImInput.value); }
        else if (e.key === 'Escape') { e.preventDefault(); resolveInputModal(null); }
      });

      function doDelete() {
        if (!currentId) return;
        clearTimeout(noteTimer.t); clearTimeout(metaTimer.t);
        // Fix 10: clear index directly rather than passing a stub to indexMeeting
        clearIndex(currentId);
        delete data.meetings[currentId];
        saveData();
        currentId = null;
        closeModal();
        elEditor.style.display = 'none';
        elEmpty.style.display = 'flex';
        renderList();
        if (activeTab === 'actions') renderConsolidated('actions');
        showToast('deleted');
      }

      // ── DIRTY / AUTO-SAVE ──
      // Fix 2/9: separate timers for notes vs meta so neither cancels the other.
      // Fix 9: shared scheduler to avoid duplicating the debounce pattern.
      const noteTimer = { t: null };  // auto-save timer for notes text
      const metaTimer = { t: null };  // auto-save timer for title/date/time

      // Fix 9: single debounce implementation shared by both save paths
      function scheduleSave(timer, saveFn, arg) {
        setDirty(true);
        clearTimeout(timer.t);
        const savedFor = currentId;
        timer.t = setTimeout(() => {
          timer.t = null;
          if (isDirty && currentId === savedFor) { saveFn(arg); showToast('saved'); }
        }, 1800);
      }

      // Fix 2: separate timers — typing notes no longer cancels pending meta save
      function markDirty(cachedText) {
        // Convert HTML to text if not provided
        if (!cachedText) cachedText = htmlToText(elNotes.innerHTML);
        scheduleSave(noteTimer, saveNote, cachedText);
      }
      function markMetaDirty() { scheduleSave(metaTimer, saveMeta); }

      function setDirty(val) {
        isDirty = val;
        elSdot.className = 'sdot ' + (val ? 'dirty' : 'saved');
      }

      function updateStatusBar(date, actions, decisions) {
        const parts = [];
        if (date) parts.push(fmtDate(date));
        if (actions.length) parts.push(`${actions.length} action${actions.length !== 1 ? 's' : ''}`);
        if (decisions.length) parts.push(`${decisions.length} decision${decisions.length !== 1 ? 's' : ''}`);
        const today = new Date().toISOString().slice(0, 10);
        const overdueCount = actions.filter(a => !a.isDone && a.deadline && a.deadline < today).length;
        if (overdueCount) parts.push(`${overdueCount} overdue`);
        elStxt.textContent = parts.join(' · ') || '—';
      }

      // ── EXPORT / IMPORT ──
      function exportData() {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = Object.assign(document.createElement('a'), {
          href: URL.createObjectURL(blob),
          download: `minutes-${new Date().toISOString().slice(0, 10)}.json`,
        });
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('exported ↑');
      }

      async function importData(input) {
        const file = input.files[0];
        if (!file) return;
        clearTimeout(noteTimer.t); clearTimeout(metaTimer.t);
        try {
          const imported = JSON.parse(await file.text());
          if (!imported.meetings) throw new Error('missing meetings key');
          data = imported;
          // Rebuild denormalized index (handles files from older versions without it)
          data.actions = []; data.decisions = [];
          Object.values(data.meetings).forEach(indexMeeting);
          saveData();
          currentId = null;
          elEditor.style.display = 'none';
          elEmpty.style.display = 'flex';
          renderList();
          showToast('imported ✓');
        } catch (e) {
          console.error('importData failed:', e);
          showToast('invalid file');
        }
        input.value = '';
      }

      // ── GLOBAL KEYBOARD ──
      document.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
          e.preventDefault();
          // Fix 3: only run the save path(s) that have a pending timer
          if (noteTimer.t) { clearTimeout(noteTimer.t); noteTimer.t = null; saveNote(htmlToText(elNotes.innerHTML)); }
          if (metaTimer.t) { clearTimeout(metaTimer.t); metaTimer.t = null; saveMeta(); }
          if (isDirty) showToast('saved');
        }
        if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
          e.preventDefault();
          newNote();
        }
      });

      elDelModal.addEventListener('click', e => { if (e.target === elDelModal) closeModal(); });

      [elTitle, elDate, elTime].forEach(el => {
        el.addEventListener('input', markMetaDirty);
      });

      elSearch.addEventListener('input', renderList);

      // ── UTILS ──
      function fmtDate(d) {
        if (!d) return '';
        const [y, m, day] = d.split('-');
        return `${parseInt(day, 10)} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m - 1]} ${y}`;
      }

      function deadlineBadge(deadline) {
        if (!deadline) return '';
        const today = new Date().toISOString().slice(0, 10);
        const cls = deadline < today ? 'dl-overdue' : deadline === today ? 'dl-today' : 'dl-upcoming';
        return `<span class="dl-badge ${cls}">${fmtDate(deadline)}</span>`;
      }

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function showToast(msg, action) {
        // action (optional): { label, fn } renders an inline button and keeps
        // the toast up longer so it's clickable. Setting textContent first
        // also clears any button left over from a previous toast.
        elToast.textContent = msg;
        if (action) {
          const btn = document.createElement('button');
          btn.className = 'toast-btn';
          btn.textContent = action.label;
          btn.onclick = () => {
            clearTimeout(toastTmr);
            elToast.classList.remove('on');
            action.fn();
          };
          elToast.appendChild(btn);
        }
        elToast.classList.add('on');
        clearTimeout(toastTmr);
        toastTmr = setTimeout(() => elToast.classList.remove('on'), action ? 6000 : 2000);
      }

      // Offer a one-tap undo for an action that rewrote a meeting's notes.
      // Snapshot the prior notes/updatedAt before the mutation and pass them in.
      function showUndo(msg, meetingId, prevNotes, prevUpdatedAt) {
        if (prevNotes == null) { showToast(msg); return; }
        showToast(msg, {
          label: 'Undo',
          fn: () => {
            const m = data.meetings[meetingId];
            if (!m) return;
            m.notes = prevNotes;
            if (prevUpdatedAt) m.updatedAt = prevUpdatedAt;
            indexMeeting(m);
            saveData();
            if (currentId === meetingId) {
              elNotes.innerHTML = textToHTML(m.notes) || '<ol><li><br></li></ol>';
              const acts = parseActions(m.notes), decs = parseDecisions(m.notes);
              updateInferred(acts, decs);
              updateStatusBar(m.date, acts, decs);
            }
            renderList();
            updateReviewBadge();
            if (activeTab === 'actions') renderConsolidated('actions');
            showToast('undone');
          },
        });
      }


      // ── CLOSE ACTION ──
      async function closeAction(btn) {
        const fullText = btn.dataset.fulltext;
        if (!fullText) return;

        const note = await inputModal({ title: 'Mark action done', placeholder: 'Closure note (optional)', confirmText: 'Mark done' });
        if (note === null) return; // cancelled

        const meeting = data.meetings[currentId];
        if (!meeting) return;

        const undoId = currentId, prevNotes = meeting.notes, prevUpd = meeting.updatedAt;

        // Find and update the line in the notes
        const lines = meeting.notes.split('\n');
        const targetIdx = lines.findIndex(line => {
          const cleaned = line.replace(/^\t+/, '').trim();
          return cleaned.includes(fullText);
        });

        if (targetIdx >= 0) {
          lines[targetIdx] += ` [done: ${note}]`;
          meeting.notes = lines.join('\n');
