          meeting.updatedAt = new Date().toISOString();

          // Update contenteditable if this is the current note
          elNotes.innerHTML = textToHTML(meeting.notes);


          // Re-parse and update displays
          const actions = parseActions(meeting.notes);
          const decisions = parseDecisions(meeting.notes);
          updateInferred(actions, decisions);
          updateStatusBar(meeting.date, actions, decisions);

          // Re-index and save
          indexMeeting(meeting);
          saveData();

          // Refresh consolidated if visible
          if (activeTab === 'actions') renderConsolidated('actions');
          showUndo('marked done', undoId, prevNotes, prevUpd);
        }
      }

      async function closeActionFromTable(btn, meetingId) {
        const note = await inputModal({ title: 'Mark action done', placeholder: 'Closure note (optional)', confirmText: 'Mark done' });
        if (note === null) return;

        const actionData = JSON.parse(btn.dataset.action);
        const meeting = data.meetings[meetingId];
        if (!meeting) return;

        const prevNotes = meeting.notes, prevUpd = meeting.updatedAt;

        const lines = meeting.notes.split('\n');
        const targetIdx = lines.findIndex(line => {
          const cleaned = line.replace(/^\t+/, '').trim();
          return cleaned.includes(actionData.fullText);
        });

        if (targetIdx >= 0) {
          lines[targetIdx] += ` [done: ${note}]`;
          meeting.notes = lines.join('\n');
          meeting.updatedAt = new Date().toISOString();

          if (currentId === meetingId) {
            elNotes.innerHTML = textToHTML(meeting.notes);
            const actions = parseActions(meeting.notes);
            const decisions = parseDecisions(meeting.notes);
            updateInferred(actions, decisions);
            updateStatusBar(meeting.date, actions, decisions);
          }

          indexMeeting(meeting);
          saveData();

          // Refresh the table view (handles detail + all-actions modes)
          if (activeTab === 'actions') renderConsolidated('actions');
          showUndo('marked done', meetingId, prevNotes, prevUpd);
        }
      }


      // ── TAGS PANEL ──
      function renderTagsPanel() {
        const q = elFilterTags.value.toLowerCase().trim();
        const tagMap = {};
        for (const m of Object.values(data.meetings)) {
          for (const tag of (m.tags || [])) {
            if (!q || tag.includes(q)) {
              tagMap[tag] = (tagMap[tag] || 0) + 1;
            }
          }
        }
        const entries = Object.entries(tagMap)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        elListTags.innerHTML = entries.length
          ? entries.map(([tag, count]) => {
              const isSelected = tagsView.selectedTag === tag;
              return `
          <div class="tag-item${isSelected ? ' tag-item-active' : ''}" onclick="app.filterByTag('${esc(tag)}')">
            <span class="tag-item-name">#${esc(tag)}</span>
            <span class="tag-item-count">${count}</span>
          </div>`;
            }).join('')
          : '<div class="list-empty">no tags yet</div>';
      }

      function showTagNotes(tag) {
        const meetings = Object.values(data.meetings)
          .filter(m => (m.tags || []).includes(tag))
          .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

        elEmpty.style.display = 'none';
        elEditor.style.display = 'none';

        // Extract lines from a note that contain the given tag
        function tagLines(notes) {
          const re = new RegExp('#' + tag + '\\b', 'i');
          return (notes || '').split('\n')
            .map(l => l.replace(/^\t+/, '').trim())
            .filter(l => re.test(l));
        }

        let tableHTML = `
    <div class="actions-table-wrap">
      <div class="actions-table-header">
        <h2>#${esc(tag)}</h2>
        <span class="actions-count">${meetings.length} note${meetings.length !== 1 ? 's' : ''}</span>
      </div>
      <table class="actions-table">
        <thead>
          <tr>
            <th>Note</th>
            <th>Meeting</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
`;
        for (const m of meetings) {
          const lines = tagLines(m.notes);
          const noteCell = lines.length
            ? lines.map(l => `<div class="tag-note-line">${esc(l)}</div>`).join('')
            : `<span class="meeting-title">${esc(m.title || 'Untitled')}</span>`;
          tableHTML += `
      <tr onclick="app.openNote('${m.id}', true)">
        <td class="action-text">${noteCell}</td>
        <td class="meeting-title">${esc(m.title || 'Untitled')}</td>
        <td class="meeting-date">${m.date ? fmtDate(m.date) : '—'}</td>
      </tr>`;
        }
        tableHTML += `
        </tbody>
      </table>
    </div>
`;

        const main = document.querySelector('.main');
        let tagsTableContainer = document.getElementById('tags-table-container');
        if (!tagsTableContainer) {
          tagsTableContainer = document.createElement('div');
          tagsTableContainer.id = 'tags-table-container';
          tagsTableContainer.className = 'actions-table-container';
          main.appendChild(tagsTableContainer);
        }
        tagsTableContainer.innerHTML = tableHTML;
        tagsTableContainer.style.display = 'block';
      }

      function filterByTag(tag) {
        tagsView = { mode: 'detail', selectedTag: tag };
        switchTab('tags');
        renderTagsPanel();
        showTagNotes(tag);
      }

      // ── CROSS-REFERENCE MODAL (tags & people) ──
      // Quick popup tracing every past note line tied to a given #tag or
      // @person, so nothing discussed under that thread gets missed. Ordering:
      //   1. Open items with a deadline → soonest deadline first (overdue up top)
      //   2. Everything else (no deadline OR completed) → newest meeting first
      const elTagModal = document.getElementById('tag-modal');
      const elTagmTitle = document.getElementById('tagm-title');
      const elTagmBody = document.getElementById('tagm-body');

      function reEscape(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

      // Collect every note line carrying a #tag, as ref-modal entries.
      function tagEntries(tag) {
        // Lookahead (not \b) so #api does not match the longer tag #api-v2.
        const re = new RegExp('#' + reEscape(tag) + '(?![a-zA-Z0-9_-])', 'i');
        const entries = [];
        for (const m of Object.values(data.meetings)) {
          if (!(m.tags || []).includes(tag)) continue;
          const lines = (m.notes || '').split('\n')
            .map(l => l.replace(/^\t+/, '').trim())
            .filter(l => re.test(l));
          for (const raw of lines) {
            const line = expandDeadlineShortcuts(raw);
            const dlMatch = line.match(/!(\d{4}-\d{2}-\d{2})/);
            const doneMatch = line.match(/\[(done|closed):\s*(.+?)\]\s*$/i);
            const text = line
              .replace(/^[→>*\-\d.]+\s*/, '')
              .replace(/\[(done|closed):.+?\]\s*$/i, '')
              .replace(/!\d{4}-\d{2}-\d{2}/g, '')
              .replace(/\s+/g, ' ').trim();
            if (!text) continue;
            entries.push({
              meetingId: m.id,
              title: m.title || 'Untitled',
              meetingDate: m.date || '',
              text,
              deadline: dlMatch ? dlMatch[1] : null,
              isDone: !!doneMatch,
            });
          }
        }
        return entries;
      }

      // Collect every action assigned to a @person, from the denormalized index.
      function personEntries(person) {
        return data.actions
          .filter(a => a.owners.includes(person))
          .map(a => ({
            meetingId: a.meetingId,
            title: a.meetingTitle || 'Untitled',
            meetingDate: a.meetingDate || '',
            text: a.text,
            deadline: a.deadline,
            isDone: a.isDone,
          }));
      }

      function refItemHTML(e, highlightRe) {
        let textHTML = esc(e.text);
        if (highlightRe) textHTML = textHTML.replace(highlightRe, m => `<mark>${m}</mark>`);
        const meta = [`<span class="tagm-meeting">${esc(e.title)}</span>`];
        if (e.meetingDate) meta.push(`<span class="sep">·</span><span>${fmtDate(e.meetingDate)}</span>`);
        if (e.deadline && !e.isDone) meta.push(deadlineBadge(e.deadline));
        if (e.isDone) meta.push(`<span class="sep">·</span><span>done</span>`);
        return `
      <div class="tagm-item${e.isDone ? ' done' : ''}" onclick="app.openRefNote('${e.meetingId}')">
        <div class="tagm-item-text">${textHTML}</div>
        <div class="tagm-item-meta">${meta.join(' ')}</div>
      </div>`;
      }

      // Shared renderer: split entries into the two ordered groups and paint.
      function openRefModal({ title, entries, highlightRe, empty, unit }) {
        const total = entries.length;
        const scheduled = entries.filter(e => e.deadline && !e.isDone)
          .sort((a, b) => a.deadline.localeCompare(b.deadline));
        const rest = entries.filter(e => !e.deadline || e.isDone)
          .sort((a, b) => (b.meetingDate || '').localeCompare(a.meetingDate || ''));

        elTagmTitle.innerHTML = `${esc(title)}<span class="tagm-sub" id="tagm-sub"></span>`;
        document.getElementById('tagm-sub').textContent =
          total ? `${total} ${unit}${total !== 1 ? 's' : ''}` : '';

        let body = '';
        if (!total) {
          body = `<div class="tagm-empty">${esc(empty)}</div>`;
        } else {
          if (scheduled.length) {
            body += '<div class="tagm-group-lbl">By deadline</div>';
            body += scheduled.map(e => refItemHTML(e, highlightRe)).join('');
          }
          if (rest.length) {
            if (scheduled.length) body += '<div class="tagm-group-lbl">By meeting date</div>';
            body += rest.map(e => refItemHTML(e, highlightRe)).join('');
          }
        }
        elTagmBody.innerHTML = body;
        elTagmBody.scrollTop = 0;
        elTagModal.classList.add('open');
      }

      function openTagModal(tag) {
        openRefModal({
          title: `#${tag}`,
          entries: tagEntries(tag),
          highlightRe: new RegExp('#' + reEscape(tag) + '(?![a-zA-Z0-9_-])', 'gi'),
          empty: 'No other notes mention this tag yet.',
          unit: 'mention',
        });
      }

      function openPersonModal(person) {
        openRefModal({
          title: `@${person}`,
          entries: personEntries(person),
          highlightRe: new RegExp('@' + reEscape(person) + '(?![a-zA-Z0-9_.+-])', 'gi'),
          empty: 'No actions assigned to this person yet.',
          unit: 'action',
        });
      }

      function closeTagModal() { elTagModal.classList.remove('open'); }

      function openRefNote(id) {
        closeTagModal();
        openNote(id, activeTab !== 'notes');
      }

      document.getElementById('tagm-close').addEventListener('click', closeTagModal);
      elTagModal.addEventListener('click', e => { if (e.target === elTagModal) closeTagModal(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && elTagModal.classList.contains('open')) closeTagModal();
      });

      window.app = {
        confirmDelete, closeModal, doDelete, newNote, openNote, exportData, importData,
        closeAction, closeActionFromTable, showPersonActions, showPersonList, filterByTag,
        showReview, showAllActions, reviewDone, reviewSnooze, reviewReschedule,
        openTagModal, openPersonModal, openRefNote, closeTagModal
      };

      function showPersonActions(person) {
        actionsView = { mode: 'detail', selectedPerson: person };
        renderActionsByPerson();  // Re-render list to show highlighting
        renderActionsForPerson(person);
      }

      function showPersonList() {
        actionsView = { mode: 'all', selectedPerson: null };
        renderActionsByPerson();
        renderAllActions();
      }
      function showAllActions() { showPersonList(); }

      function showReview() {
        actionsView = { mode: 'review', selectedPerson: null };
        renderActionsByPerson();
        renderReview();
      }

      // ── REVIEW INBOX ──
      // Split open actions into urgency buckets for frictionless review.
      function reviewItems() {
        const today = new Date().toISOString().slice(0, 10);
        const wk = new Date(); wk.setDate(wk.getDate() + 7);
        const weekOut = wk.toISOString().slice(0, 10);
        const overdue = [], dueSoon = [], noDate = [];
        for (const a of data.actions) {
          if (a.isDone) continue;
          if (a.deadline && a.deadline < today) overdue.push(a);
          else if (a.deadline && a.deadline <= weekOut) dueSoon.push(a);
          else if (!a.deadline) noDate.push(a);
        }
        const byDeadline = (x, y) => x.deadline.localeCompare(y.deadline);
        overdue.sort(byDeadline);
        dueSoon.sort(byDeadline);
        return { overdue, dueSoon, noDate };
      }

      // Red pill on the Actions rail-tab showing how many items need review.
      function updateReviewBadge() {
        const tab = document.querySelector('.rail-tab[data-tab="actions"]');
        if (!tab) return;
        const { overdue, dueSoon } = reviewItems();
        const n = overdue.length + dueSoon.length;
        let badge = tab.querySelector('.tab-badge');
        if (!n) { if (badge) badge.remove(); return; }
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'tab-badge';
          tab.appendChild(badge);
        }
        badge.textContent = n;
        badge.setAttribute('aria-label', `${n} action${n === 1 ? '' : 's'} need attention`);
        badge.classList.toggle('tab-badge-overdue', overdue.length > 0);
      }

      function reviewRow(a) {
        const owners = a.owners.map(o => '@' + esc(o)).join(', ');
        const mid = esc(a.meetingId), full = esc(a.fullText);
        const snooze = a.deadline
          ? `<button class="rev-btn" data-mid="${mid}" data-full="${full}" onclick="event.stopPropagation();app.reviewSnooze(this)">Snooze 1w</button>`
          : '';
        return `
      <tr onclick="app.openNote('${a.meetingId}', true)">
        <td class="action-text">${esc(a.text)}</td>
        <td class="action-owners">${owners}</td>
        <td>${deadlineBadge(a.deadline)}</td>
        <td class="meeting-title">${esc(a.meetingTitle || 'Untitled')}</td>
        <td class="rev-actions">
          <button class="rev-btn rev-done" data-mid="${mid}" data-full="${full}" onclick="event.stopPropagation();app.reviewDone(this)">Done</button>
          ${snooze}
          <button class="rev-btn" data-mid="${mid}" data-full="${full}" onclick="event.stopPropagation();app.reviewReschedule(this)">Reschedule</button>
        </td>
      </tr>`;
      }

      function renderReview() {
        const { overdue, dueSoon, noDate } = reviewItems();
        elEmpty.style.display = 'none';
        elEditor.style.display = 'none';

        const openSection = (title, cls, items) => items.length ? `
    <div class="review-section">
      <h3 class="review-head ${cls}">${title} <span class="review-num">${items.length}</span></h3>
      <table class="actions-table"><tbody>${items.map(reviewRow).join('')}</tbody></table>
    </div>` : '';

        const noDateSection = noDate.length ? `
    <details class="review-section">
      <summary class="review-head review-muted">No deadline <span class="review-num">${noDate.length}</span></summary>
      <table class="actions-table"><tbody>${noDate.map(reviewRow).join('')}</tbody></table>
    </details>` : '';

        let html;
        if (!overdue.length && !dueSoon.length && !noDate.length) {
          html = `<div class="review-empty">✓ Nothing to review — all caught up.</div>`;
        } else {
          html = `
    <div class="actions-table-wrap">
      <div class="actions-table-header">
        <h2>Review</h2>
        <span class="actions-count">${overdue.length + dueSoon.length} need attention</span>
      </div>
      ${openSection('Overdue', 'review-overdue', overdue)}
      ${openSection('Due this week', 'review-soon', dueSoon)}
      ${noDateSection}
    </div>`;
        }

        const main = document.querySelector('.main');
        let c = document.getElementById('actions-table-container');
        if (!c) {
          c = document.createElement('div');
          c.id = 'actions-table-container';
          c.className = 'actions-table-container';
          main.appendChild(c);
        }
        c.innerHTML = html;
        c.style.display = 'block';
      }

      // Find the note line for an action and apply a transform, then persist + refresh.
      function rewriteActionLine(meetingId, fullText, transform) {
        const meeting = data.meetings[meetingId];
        if (!meeting) return false;
        const lines = meeting.notes.split('\n');
        const idx = lines.findIndex(line => line.replace(/^\t+/, '').trim().includes(fullText));
        if (idx < 0) return false;
        lines[idx] = transform(lines[idx]);
        meeting.notes = lines.join('\n');
        meeting.updatedAt = new Date().toISOString();
        indexMeeting(meeting);
        saveData();
        if (currentId === meetingId) {
          elNotes.innerHTML = textToHTML(meeting.notes);
          const acts = parseActions(meeting.notes);
          const decs = parseDecisions(meeting.notes);
          updateInferred(acts, decs);
          updateStatusBar(meeting.date, acts, decs);
        }
        return true;
      }

      function refreshReview() {
        renderActionsByPerson();
        renderReview();
        updateReviewBadge();
      }

      async function reviewDone(btn) {
        // Match the existing Mark-done buttons: capture a closure note and
        // store it inline as the action's [done: …] marker.
        const note = await inputModal({ title: 'Mark action done', placeholder: 'Closure note (optional)', confirmText: 'Mark done' });
        if (note === null) return;
        const mid = btn.dataset.mid, m = data.meetings[mid];
        const prevNotes = m ? m.notes : null, prevUpd = m ? m.updatedAt : null;
        if (rewriteActionLine(mid, btn.dataset.full, l => `${l} [done: ${note}]`)) {
          refreshReview();
          showUndo('marked done', mid, prevNotes, prevUpd);
        }
      }

      function setReviewDeadline(mid, full, date, toast) {
        const m = data.meetings[mid];
        const prevNotes = m ? m.notes : null, prevUpd = m ? m.updatedAt : null;
        const ok = rewriteActionLine(mid, full, l =>
          /!\d{4}-\d{2}-\d{2}/.test(l) ? l.replace(/!\d{4}-\d{2}-\d{2}/, '!' + date) : `${l} !${date}`);
        if (ok) { refreshReview(); showUndo(toast, mid, prevNotes, prevUpd); }
      }

      function reviewSnooze(btn) {
        const d = new Date(); d.setDate(d.getDate() + 7);
        setReviewDeadline(btn.dataset.mid, btn.dataset.full, d.toISOString().slice(0, 10), 'snoozed 1 week');
      }

      async function reviewReschedule(btn) {
        const input = await inputModal({
          title: 'Reschedule deadline', type: 'date',
          initial: new Date().toISOString().slice(0, 10), confirmText: 'Set deadline',
        });
        if (input === null) return;
        const v = (input || '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { showToast('pick a valid date'); return; }
        setReviewDeadline(btn.dataset.mid, btn.dataset.full, v, 'rescheduled');
      }

      // Register service worker for offline support
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW registration failed:', e));
      }

      // Async init: load from IndexedDB, migrating from localStorage if needed
      (async () => {
        let stored = await loadData();
        if (!stored) {
          try {
            const raw = localStorage.getItem(DB_KEY);
            if (raw) {
              stored = JSON.parse(raw);
              data = stored;
              await saveData();
              localStorage.removeItem(DB_KEY);
            }
          } catch (e) { console.warn('localStorage migration failed:', e); }
        } else {
          data = stored;
        }
        // Populate tags for meetings from older data versions (tags field missing)
        Object.values(data.meetings).forEach(m => { if (!m.tags) m.tags = parseTags(m.notes || ''); });
        renderList();
      })();

    })();
  </script>
</body>
